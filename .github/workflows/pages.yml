name: Publish web preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run sync:android
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Build downloadable testing APK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --console=plain
          cd ..
          mkdir -p www/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk www/downloads/PitayaGrade-debug.apk
          APK_PATH=www/downloads/PitayaGrade-debug.apk
          APK_SHA=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          APK_BYTES=$(stat -c%s "$APK_PATH")
          BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          node -e 'const fs=require("fs"); const [file,sha,bytes,commit,builtAt]=process.argv.slice(1); fs.writeFileSync("www/downloads/release.json", JSON.stringify({version:"1.0.0-testing",channel:"Testing build",file,sha256:sha,bytes:Number(bytes),commit,builtAt,signedRelease:false},null,2)+"\n");' "PitayaGrade-debug.apk" "$APK_SHA" "$APK_BYTES" "$GITHUB_SHA" "$BUILD_TIME"
          printf '%s  %s\n' "$APK_SHA" 'PitayaGrade-debug.apk' > www/downloads/PitayaGrade-debug.apk.sha256
          python3 scripts/create_testing_pack.py --output-dir www/testing-pack --apk "$APK_PATH" --app-version 1.0.0-testing
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
