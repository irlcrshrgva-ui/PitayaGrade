name: Publish web preview

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Keep model upload chunks out of the deployed site
        run: rm -f www/model/quality/efficientnet-b3.onnx.part-01 www/model/quality/efficientnet-b3.onnx.part-02
      - name: Build testing worksheets for the published signed APK
        run: |
          APK_PATH="$RUNNER_TEMP/PitayaGrade-1.0.4.apk"
          DOWNLOAD_URL=$(node -e 'process.stdout.write(require("./downloads/release.json").downloadUrl)')
          EXPECTED_SHA=$(node -e 'process.stdout.write(require("./downloads/release.json").sha256)')
          curl --fail --location --retry 3 "$DOWNLOAD_URL" --output "$APK_PATH"
          ACTUAL_SHA=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          python3 scripts/create_testing_pack.py --output-dir www/testing-pack --apk "$APK_PATH" --app-version 1.0.4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
