name: Verify application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check packaged sources are committed
        run: git diff --exit-code -- www

  android:
    needs: software
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run sync:android
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install Android build dependencies
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build debug APK and lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: PitayaGrade-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint
          path: android/app/build/reports/lint-results-debug.*
