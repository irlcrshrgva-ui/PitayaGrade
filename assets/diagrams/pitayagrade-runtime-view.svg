<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs><style>.title{font:700 34px Arial;fill:#35152f}.sub{font:400 17px Arial;fill:#76536f}.box{fill:#512044}.alt{fill:#bd4d8f}.gold{fill:#d39a35}.label{font:700 17px Arial;fill:#fff}.life{stroke:#b994ad;stroke-width:2;stroke-dasharray:8 7}.msg{stroke:#512044;stroke-width:2.4;fill:none;marker-end:url(#a)}.ret{stroke:#8d557e;stroke-width:2.2;stroke-dasharray:8 5;fill:none;marker-end:url(#a)}.txt{font:500 15px Arial;fill:#35152f}.step{font:700 14px Arial;fill:#bd4d8f}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#512044"/></marker></defs>
  <rect width="1200" height="1500" fill="#fffafd"/><text x="80" y="90" class="title">Runtime View Diagram</text><text x="80" y="125" class="sub">PitayaGrade offline scan and selectable-model execution sequence</text>
  <g><rect x="55" y="180" width="185" height="115" rx="16" class="gold"/><text x="147" y="232" text-anchor="middle" class="label">Farmer / User</text><text x="147" y="258" text-anchor="middle" class="label">📱</text><rect x="275" y="180" width="185" height="115" rx="16" class="box"/><text x="367" y="225" text-anchor="middle" class="label">PitayaGrade</text><text x="367" y="251" text-anchor="middle" class="label">Mobile Interface</text><rect x="495" y="180" width="185" height="115" rx="16" class="alt"/><text x="587" y="225" text-anchor="middle" class="label">Scan &amp; Model</text><text x="587" y="251" text-anchor="middle" class="label">Controller</text><rect x="715" y="180" width="185" height="115" rx="16" class="box"/><text x="807" y="225" text-anchor="middle" class="label">ONNX Runtime</text><text x="807" y="251" text-anchor="middle" class="label">Web / WASM</text><rect x="935" y="180" width="185" height="115" rx="16" class="gold"/><text x="1027" y="225" text-anchor="middle" class="label">Local Models</text><text x="1027" y="251" text-anchor="middle" class="label">&amp; Storage</text></g>
  <g><line x1="147" y1="295" x2="147" y2="1360" class="life"/><line x1="367" y1="295" x2="367" y2="1360" class="life"/><line x1="587" y1="295" x2="587" y2="1360" class="life"/><line x1="807" y1="295" x2="807" y2="1360" class="life"/><line x1="1027" y1="295" x2="1027" y2="1360" class="life"/></g>
  <text x="165" y="355" class="step">1</text><path d="M147 365H367" class="msg"/><text x="255" y="348" text-anchor="middle" class="txt">Select grading model</text>
  <text x="385" y="435" class="step">2</text><path d="M367 445H1027" class="msg"/><text x="695" y="428" text-anchor="middle" class="txt">Save model preference</text>
  <text x="165" y="520" class="step">3</text><path d="M147 530H367" class="msg"/><text x="255" y="513" text-anchor="middle" class="txt">Capture or upload image</text>
  <text x="385" y="600" class="step">4</text><path d="M367 610H587" class="msg"/><text x="475" y="593" text-anchor="middle" class="txt">Submit image for analysis</text>
  <text x="605" y="680" class="step">5</text><path d="M587 690H807" class="msg"/><text x="697" y="673" text-anchor="middle" class="txt">Preprocess image</text>
  <text x="825" y="755" class="step">6</text><path d="M807 765H1027" class="msg"/><text x="917" y="748" text-anchor="middle" class="txt">Load YOLOv8-Nano</text>
  <text x="825" y="835" class="step">7</text><path d="M807 845H1027" class="msg"/><text x="917" y="817" text-anchor="middle" class="txt">Load selected classifier</text><text x="917" y="835" text-anchor="middle" class="sub">MobileNetV2 / ResNet50 / EfficientNet-B3</text>
  <text x="825" y="920" class="step">8</text><path d="M807 930H1027" class="msg"/><text x="917" y="913" text-anchor="middle" class="txt">Load disease classifier</text>
  <text x="605" y="1000" class="step">9</text><path d="M807 1010H587" class="ret"/><text x="697" y="983" text-anchor="middle" class="txt">Return grade, disease, confidence</text>
  <text x="605" y="1085" class="step">10</text><path d="M587 1095H1027" class="msg"/><text x="807" y="1078" text-anchor="middle" class="txt">Save result, model name and time</text>
  <text x="385" y="1170" class="step">11</text><path d="M587 1180H367" class="ret"/><text x="477" y="1163" text-anchor="middle" class="txt">Return complete scan result</text>
  <text x="165" y="1255" class="step">12</text><path d="M367 1265H147" class="ret"/><text x="257" y="1238" text-anchor="middle" class="txt">Display result and recommendation</text>
  <path d="M367 1335H147" class="ret"/><text x="257" y="1318" text-anchor="middle" class="txt">History, analytics or CSV report</text>
  <text x="600" y="1430" text-anchor="middle" class="sub">No cloud connection is required during inference; model files and scan records remain on the device.</text>
</svg>
