<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Loading latest PitayaGrade</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #080d18; color: #f8fafc; }
    main { width: min(480px, 100%); padding: 32px; border: 1px solid #27344a; border-radius: 24px; background: #111a2b; text-align: center; box-shadow: 0 24px 80px #0008; }
    img { width: 84px; height: 84px; border-radius: 20px; }
    h1 { margin: 20px 0 10px; font-size: clamp(1.6rem, 6vw, 2.2rem); }
    p { margin: 0 0 22px; color: #a9b7cb; line-height: 1.55; }
    .spinner { width: 34px; height: 34px; margin: 0 auto 22px; border: 4px solid #334155; border-top-color: #e91e63; border-radius: 50%; animation: spin .8s linear infinite; }
    a { display: inline-block; color: #fff; background: #e91e63; padding: 12px 18px; border-radius: 12px; font-weight: 700; text-decoration: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; border-top-color: #4caf50; } }
  </style>
</head>
<body>
  <main>
    <img src="assets/logo.png" alt="PitayaGrade logo">
    <h1>Loading latest PitayaGrade</h1>
    <p id="status">Refreshing the scanner safely. Your scan records and settings will stay on this device.</p>
    <div class="spinner" aria-hidden="true"></div>
    <a id="fallback" href="./?release=latest" hidden>Open PitayaGrade</a>
  </main>
  <script>
    (async () => {
      const status = document.querySelector('#status');
      const fallback = document.querySelector('#fallback');
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations
            .filter(registration => registration.scope.startsWith(new URL('./', location.href).href))
            .map(registration => registration.unregister()));
        }
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names
            .filter(name => name.startsWith('pitayagrade-web-'))
            .map(name => caches.delete(name)));
        }
        location.replace(`./?release=latest&updated=${Date.now()}`);
      } catch (error) {
        status.textContent = 'Automatic refresh could not finish. Tap below to open PitayaGrade, then refresh the page once.';
        fallback.hidden = false;
      }
    })();
  </script>
</body>
</html>
