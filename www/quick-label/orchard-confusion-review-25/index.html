<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PitayaGrade photo labeling</title>
<style>
  body { margin: auto; max-width: 62rem; padding: 1rem; font: 1rem system-ui; color: #211b24; background: #f7f4f7; }
  h1, p { margin: .45rem 0; }
  header, .row { display: flex; gap: .65rem; flex-wrap: wrap; align-items: center; }
  header { justify-content: space-between; }
  figure { margin: .75rem 0; padding: .5rem; background: #242129; color: white; text-align: center; border-radius: .6rem; }
  img { width: 100%; height: min(56vh, 34rem); object-fit: contain; display: block; }
  figcaption { padding-top: .35rem; }
  button, input { padding: .55rem; border: 1px solid #746a79; border-radius: .4rem; font: inherit; background: white; color: inherit; }
  button { cursor: pointer; min-height: 2.7rem; }
  button[aria-pressed="true"], #export { background: #552157; color: white; }
  button:focus-visible, input:focus-visible { outline: 3px solid #752479; outline-offset: 2px; }
  .grades { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); gap: .5rem; margin: .65rem 0; }
  .grades span { display: block; font-size: .83rem; }
  #notes { width: min(95%, 20rem); }
  #status { min-height: 1.4em; }
  textarea { width: 100%; min-height: 6rem; }
</style>
<header>
  <div>
    <h1>Orchard confusion review · 25 photos</h1>
    <p id="progress"></p>
  </div>
  <button id="export" type="button">Download grading CSV</button>
</header>
<figure>
  <img id="photo" alt="Dragon fruit to grade">
  <figcaption id="caption"></figcaption>
</figure>
<div class="grades" aria-label="Choose a grade">
  <button type="button" data-grade="Grade A">1 · Grade A<span>No visible blemishes</span></button>
  <button type="button" data-grade="Grade B">2 · Grade B<span>Minor cosmetic flaws</span></button>
  <button type="button" data-grade="Grade C">3 · Grade C<span>Obvious flaws, still sellable</span></button>
  <button type="button" data-grade="Reject">4 · Reject<span>Severe damage or confirmed rot</span></button>
  <button type="button" data-grade="">5 · Unsure<span>Leave the grade blank</span></button>
</div>
<div class="row">
  <button id="prev" type="button">← Previous</button>
  <button id="next" type="button">Next →</button>
  <button id="unreviewed" type="button">Next unreviewed</button>
  <label>Initials <input id="initials" size="6" maxlength="20"></label>
  <label>Fruit group <input id="group" size="8"></label>
  <label>Notes <input id="notes"></label>
</div>
<p id="status" role="status">Review all 25 photos independently. Labels are saved in this browser; download the CSV before switching devices.</p>
<details id="backup" hidden>
  <summary>Copy CSV if the download is blocked</summary>
  <p>Copy the text into a plain text editor and save it as <code id="filename"></code>.</p>
  <textarea id="csvText" aria-label="Grading CSV text" readonly></textarea>
</details>
<script type="application/json" id="pack">{"number":"Orchard blind confusion recheck 2026-11-14","photos":["PG-TEST-02.jpg","PG-TEST-07.jpg","PG-TEST-08.jpg","PG-TEST-09.jpg","PG-TEST-10.jpg","PG-TEST-11.jpg","PG-TEST-13.jpg","PG-TEST-15.jpg","PG-TEST-17.jpg","PG-TEST-18.jpg","PG-TEST-19.jpg","PG-TEST-22.jpg","PG-TEST-24.jpg","PG-TEST-26.jpg","PG-TEST-27.jpg","PG-TEST-28.jpg","PG-TEST-29.jpg","PG-TEST-30.jpg","PG-TEST-32.jpg","PG-TEST-33.jpg","PG-TEST-35.jpg","PG-TEST-36.jpg","PG-TEST-37.jpg","PG-TEST-38.jpg","PG-TEST-39.jpg"],"sheet":"grading-sheet-orchard-confusion-review-25.csv"}</script>
<script>
  const byId = id => document.getElementById(id);
  const { number, photos, sheet } = JSON.parse(byId('pack').textContent);
  const storageKey = 'pitayagrade-labeling-v1-' + number;
  let state = { index: 0, initials: '', decisions: {} };
  let storageAvailable = true;
  try {
    const saved = localStorage.getItem(storageKey);
    if (saved) state = JSON.parse(saved);
  } catch {
    storageAvailable = false;
  }
  const current = () => photos[state.index];
  const grades = [...document.querySelectorAll('[data-grade]')];
  const status = byId('status');
  function save() {
    try {
      localStorage.setItem(storageKey, JSON.stringify(state));
    } catch {
      storageAvailable = false;
    }
    if (!storageAvailable) status.textContent = 'Browser saving is unavailable. Keep this tab open and download the CSV before closing.';
  }
  function render() {
    const name = current();
    const decision = state.decisions[name] || {};
    byId('photo').src = 'photos/' + name;
    byId('caption').textContent = name + (state.index < 8 ? ' · Priority batch' : '');
    byId('group').value = decision.group || '';
    byId('notes').value = decision.notes || '';
    byId('prev').disabled = state.index === 0;
    byId('next').disabled = state.index === photos.length - 1;
    const reviewed = Object.values(state.decisions).filter(row => row.grade !== undefined).length;
    byId('progress').textContent = 'Reviewer ' + number + ' · Photo ' + (state.index + 1) + ' of ' + photos.length +
      ' · ' + reviewed + ' reviewed';
    for (const button of grades) button.setAttribute('aria-pressed', button.dataset.grade === decision.grade);
  }
  function move(index) {
    state.index = Math.max(0, Math.min(photos.length - 1, index));
    render();
    save();
  }
  function choose(grade) {
    const row = state.decisions[current()] ||= {};
    row.grade = grade;
    row.notes = grade ? (row.notes === 'Unsure' ? '' : row.notes || '') : row.notes || 'Unsure';
    row.initials = state.initials;
    move(state.index + 1);
  }
  for (const button of grades) button.onclick = () => choose(button.dataset.grade);
  byId('prev').onclick = () => move(state.index - 1);
  byId('next').onclick = () => move(state.index + 1);
  byId('unreviewed').onclick = () => {
    const pending = name => state.decisions[name]?.grade === undefined;
    const later = photos.findIndex((name, i) => i > state.index && pending(name));
    const index = later >= 0 ? later : photos.findIndex(pending);
    if (index >= 0) move(index);
    else status.textContent = 'Every photo has a review decision. Download the CSV.';
  };
  byId('initials').value = state.initials;
  byId('initials').oninput = event => { state.initials = event.target.value.trim(); save(); };
  byId('photo').onerror = () => { status.textContent = 'Could not load this photo. Check your connection and reload the page.'; };
  for (const id of ['group', 'notes']) {
    byId(id).oninput = event => {
      const row = state.decisions[current()] ||= {};
      row[id] = event.target.value;
      save();
    };
  }
  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || event.repeat || event.target.matches('input')) return;
    if (['1', '2', '3', '4', '5'].includes(event.key)) choose(grades[Number(event.key) - 1].dataset.grade);
    else if (event.key === 'ArrowLeft') move(state.index - 1);
    else if (event.key === 'ArrowRight') move(state.index + 1);
    else return;
    event.preventDefault();
  });
  function csvCell(value) {
    return '"' + String(value ?? '').replaceAll('"', '""') + '"';
  }
  byId('export').onclick = () => {
    const lines = photos.map(name => {
      const row = state.decisions[name] || {};
      return [name, row.grade, row.group, row.initials || (row.grade !== undefined ? state.initials : ''), row.notes]
        .map(csvCell).join(',');
    });
    const csv = '\uFEFFphoto_filename,reviewed_grade,fruit_group,reviewer_initials,notes\r\n' + lines.join('\r\n') + '\r\n';
    byId('csvText').value = csv;
    byId('filename').textContent = sheet;
    byId('backup').hidden = false;
    const link = document.createElement('a');
    link.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    link.download = sheet;
    document.body.append(link);
    link.click();
    link.remove();
    status.textContent = 'Check your browser downloads for the grading CSV. Partial batches are okay.';
  };
  render();
  save();
</script>
</html>
